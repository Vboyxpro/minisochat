<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minisoc Chat</title>
  
  <!-- JAVÍTVA: Firebase SDK-k helyes betöltése (v8 kompatibilis verziók) -->
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>

  <style>
    :root {
      --bg-color: #1a1a24;
      --card-bg: #242432;
      --primary: #007bff;
      --primary-hover: #0056b3;
      --text: #ffffff;
      --text-muted: #a0a0b0;
      --msg-in: #323246;
      --msg-out: #007bff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Névkérő ablak */
    #name-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      z-index: 999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    .login-box h2 {
      margin-bottom: 10px;
      color: var(--text);
    }

    .login-box p {
      color: var(--text-muted);
      margin-bottom: 20px;
      font-size: 14px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      background-color: var(--bg-color);
      border: 2px solid #323246;
      border-radius: 8px;
      color: var(--text);
      font-size: 16px;
      outline: none;
      margin-bottom: 15px;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    /* Chat felület elrendezése */
    #chat-container {
      width: 100%;
      max-width: 800px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--card-bg);
    }

    @media (min-width: 801px) {
      #chat-container {
        height: 90vh;
        border-radius: 15px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.4);
        overflow: hidden;
      }
    }

    /* Chat fejléc */
    .chat-header {
      background-color: #1e1e2a;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2d2d3f;
    }

    .chat-header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .user-info {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Üzenőzóna */
    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Üzenetbuborékok */
    .message {
      max-width: 75%;
      display: flex;
      flex-direction: column;
    }

    .message.incoming {
      align-self: flex-start;
    }

    .message.outgoing {
      align-self: flex-end;
    }

    .meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
      padding: 0 5px;
    }

    .message.outgoing .meta {
      text-align: right;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
    }

    .incoming .bubble {
      background-color: var(--msg-in);
      color: var(--text);
      border-top-left-radius: 4px;
    }

    .outgoing .bubble {
      background-color: var(--msg-out);
      color: white;
      border-top-right-radius: 4px;
    }

    /* Alsó beviteli sáv */
    .chat-input-area {
      padding: 15px 20px;
      background-color: #1e1e2a;
      display: flex;
      gap: 12px;
      align-items: center;
      border-top: 1px solid #2d2d3f;
    }

    .chat-input-area input {
      flex: 1;
      margin-bottom: 0;
    }

    .chat-input-area button {
      width: auto;
      padding: 12px 24px;
    }
  </style>
</head>
<body>

  <!-- Névkérő képernyő -->
  <div id="name-overlay">
    <div class="login-box">
      <h2>Üdvözöl a Minisoc Chat!</h2>
      <p>Kérlek, adj meg egy becenevet a csatlakozáshoz.</p>
      <input type="text" id="username-input" placeholder="Becenév..." maxlength="20" autocomplete="off">
      <button id="join-btn">Belépés a chatbe</button>
    </div>
  </div>

  <!-- Fő Chat felület -->
  <div id="chat-container">
    <div class="chat-header">
      <h1>💬 Minisoc Szoba</h1>
      <div class="user-info" id="user-display">Profil: -</div>
    </div>
    
    <div class="chat-messages" id="chat-messages">
      <!-- Ide töltődnek be az üzenetek dinamikusan -->
    </div>

    <div class="chat-input-area">
      <input type="text" id="msg-input" placeholder="Írj egy üzenetet..." autocomplete="off" maxlength="500">
      <button id="send-btn">Küldés</button>
    </div>
  </div>

  <script>
    // Firebase inicializálása
   const firebaseConfig = {
  apiKey: "AIzaSyDuSzQ7zSdIjIvzq8JJeu0Wuxzjhj6P3Y0",
  authDomain: "minisoc-chat.firebaseapp.com",
  projectId: "minisoc-chat",
  storageBucket: "minisoc-chat.firebasestorage.app",
  messagingSenderId: "585133612559",
  appId: "1:585133612559:web:12ad106b8490381a470d7a"
};
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let CurrentUser = "";
    let UserIP = "0.0.0.0";

    const nameOverlay = document.getElementById('name-overlay');
    const usernameInput = document.getElementById('username-input');
    const joinBtn = document.getElementById('join-btn');
    const userDisplay = document.getElementById('user-display');
    const chatMessages = document.getElementById('chat-messages');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');

   

    // Ellenőrizzük, hogy járt-e már itt és mentettünk-e nevet a gépén
    const savedName = localStorage.getItem('minisoc_username');
    if (savedName) {
      initChat(savedName);
    }

    // Belépés gomb kezelése
    joinBtn.addEventListener('click', () => {
  console.log("A gomb meg lett nyomva!"); // Ezt a sort add hozzá!
  const name = usernameInput.value.trim();
  console.log("Beírt név:", name);        // Ezt is add hozzá!
      if (name.length >= 2) {
        localStorage.setItem('minisoc_username', name);
        initChat(name);
      } else {
        alert("A névnek legalább 2 karakterből kell állnia!");
      }
    });

    // Enter lenyomására is lépjen be a névválasztónál
    usernameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') joinBtn.click();
    });

    // Chat elindítása és inicializálása
    function initChat(username) {
      CurrentUser = username;
      nameOverlay.style.display = 'none';
      userDisplay.innerText = `Felhasználó: ${CurrentUser}`;
      loadMessages();
    }

    // Üzenetek küldése a Firestore adatbázisba
    function sendMessage() {
      const text = msgInput.value.trim();
      if (!text) return;

      db.collection('messages').add({
        user: CurrentUser,
        message: text,
        ip: UserIP,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      })
      .then(() => {
        msgInput.value = "";
        msgInput.focus();
      })
      .catch(err => {
        console.error("Hiba az üzenet küldésekor: ", err);
        alert("Hiba történt! Ellenőrizd, hogy a Firebase-ben 'Test mode'-ban indítottad-e el a Firestore-t!");
      });
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Valós idejű üzenetfogadás (onSnapshot)
    function loadMessages() {
      db.collection('messages')
        .orderBy('timestamp', 'asc')
        .limitToLast(100)
        .onSnapshot(snapshot => {
          chatMessages.innerHTML = "";

          snapshot.forEach(doc => {
            const data = doc.data();
            if (!data.user || !data.message) return;

            const isOutgoing = data.user === CurrentUser;
            
            let timeStr = "";
            if (data.timestamp) {
              const date = data.timestamp.toDate();
              timeStr = date.toLocaleTimeString('hu-HU', { hour: '2-digit', minute: '2-digit' });
            } else {
              const now = new Date();
              timeStr = now.toLocaleTimeString('hu-HU', { hour: '2-digit', minute: '2-digit' });
            }

            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            msgDiv.classList.add(isOutgoing ? 'outgoing' : 'incoming');

            msgDiv.innerHTML = `
              <div class="meta">${escapeHTML(data.user)} • ${timeStr}</div>
              <div class="bubble">${escapeHTML(data.message)}</div>
            `;

            chatMessages.appendChild(msgDiv);
          });

          chatMessages.scrollTop = chatMessages.scrollHeight;
        }, error => {
console.error("Hiba az üzenetek beolvasásakor: ", error);});}// JAVÍTVA: Az escapeHTML függvény helyes formátumafunction escapeHTML(str) {return str.replace(/[&<>'"]/g, tag => ({'&': '&','<': '<','>': '>',"'": ''','"': '"'}[tag] || tag));}
