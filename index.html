<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minisoc Chat</title>
  <style>
    :root {
      --bg-color: #1a1a24;
      --card-bg: #242432;
      --primary: #007bff;
      --primary-hover: #0056b3;
      --text: #ffffff;
      --text-muted: #a0a0b0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); height: 100vh; display: flex; justify-content: center; align-items: center; }
    #name-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--bg-color); z-index: 999; display: flex; justify-content: center; align-items: center; }
    .login-box { background-color: var(--card-bg); padding: 30px; border-radius: 15px; text-align: center; width: 100%; max-width: 400px; }
    input[type="text"] { width: 100%; padding: 12px; background-color: var(--bg-color); border: 2px solid #323246; border-radius: 8px; color: var(--text); margin-bottom: 15px; outline: none; }
    button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    #chat-container { width: 100%; max-width: 800px; height: 90vh; display: flex; flex-direction: column; background-color: var(--card-bg); border-radius: 15px; overflow: hidden; }
    .chat-header { background-color: #1e1e2a; padding: 15px; display: flex; justify-content: space-between; border-bottom: 1px solid #2d2d3f; }
    .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .chat-input-area { padding: 15px; background-color: #1e1e2a; display: flex; gap: 12px; border-top: 1px solid #2d2d3f; }
    .chat-input-area input { flex: 1; margin-bottom: 0; }
    .chat-input-area button { width: auto; }
  </style>
</head>
<body>

  <!-- Névkérő képernyő -->
  <div id="name-overlay">
    <div class="login-box">
      <h2>Üdvözöl a Minisoc Chat!</h2>
      <p style="margin-bottom: 15px; color: var(--text-muted);">Adj meg egy becenevet a belépéshez.</p>
      <input type="text" id="username-input" placeholder="Becenév..." maxlength="20" autocomplete="off">
      <button id="join-btn">Belépés a chatbe</button>
    </div>
  </div>

  <!-- Fő Chat felület -->
  <div id="chat-container">
    <div class="chat-header">
      <h1>💬 Minisoc Szoba</h1>
      <div id="user-display">Profil: -</div>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-area">
      <input type="text" id="msg-input" placeholder="Írj egy üzenetet..." autocomplete="off">
      <button id="send-btn">Küldés</button>
    </div>
  </div>

  <!-- MODULÁRIS JAVASCRIPT: Ez kezeli a helyi fájl korlátozásokat -->
  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://gstatic.com";

    // A TE SAJÁT CONFIGOD
    const firebaseConfig = {
      apiKey: "AIzaSyDuSzQ7zSdIjIvzq8JJeu0Wuxzjhj6P3Y0",
      authDomain: "minisoc-chat.firebaseapp.com",
      projectId: "minisoc-chat",
      storageBucket: "minisoc-chat.firebasestorage.app",
      messagingSenderId: "585133612559",
      appId: "1:585133612559:web:12ad106b8490381a470d7a"
    };

    // Firebase indítása modern módon
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let CurrentUser = "";

    const nameOverlay = document.getElementById('name-overlay');
    const usernameInput = document.getElementById('username-input');
    const joinBtn = document.getElementById('join-btn');
    const userDisplay = document.getElementById('user-display');
    const chatMessages = document.getElementById('chat-messages');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');

    // Belépés gomb eseménykezelője
    joinBtn.addEventListener('click', () => {
      console.log("Gombnyomás sikeresen regisztrálva!");
      const name = usernameInput.value.trim();
      
      if (name.length >= 2) {
        CurrentUser = name;
        nameOverlay.style.display = 'none';
        userDisplay.innerText = `Felhasználó: ${CurrentUser}`;
        loadMessages();
      } else {
        alert("A névnek legalább 2 karakterből kell állnia!");
      }
    });

    usernameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') joinBtn.click();
    });

    // Üzenetküldés
    async function sendMessage() {
      const text = msgInput.value.trim();
      if (!text) return;

      try {
        await addDoc(collection(db, 'messages'), {
          user: CurrentUser,
          message: text,
          timestamp: serverTimestamp()
        });
        msgInput.value = "";
        msgInput.focus();
      } catch (err) {
        console.error("Küldési hiba:", err);
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Üzenetek valós idejű betöltése
    function loadMessages() {
      const q = query(collection(db, 'messages'), orderBy('timestamp', 'asc'), limit(100));
      
      onSnapshot(q, (snapshot) => {
        chatMessages.innerHTML = "";
        snapshot.forEach((doc) => {
          const data = doc.data();
          if (!data.user || !data.message) return;

          const msgDiv = document.createElement('div');
          msgDiv.style.margin = "5px 0";
          msgDiv.innerHTML = `<strong>${escapeHTML(data.user)}:</strong> ${escapeHTML(data.message)}`;
          chatMessages.appendChild(msgDiv);
        });
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }, (error) => {
        console.error("Beolvasási hiba:", error);
      });
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({ 
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&apos;', '"': '&quot;' 
      }[tag] || tag));
    }
  </script>
</body>
</html>
