<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minisoc Chat</title>
  
  <!-- FONTOS: Ide ágyaztam be a teljes Firebase kódot, így nem kell hozzá internetes CDN betöltés -->
  <script>
    !function(e,r){"object"==typeof exports&&"undefined"!=typeof module?module.exports=r():"function"==typeof define&&define.amd?define(r):(e=e||self).firebase=r()}(this,(function(){"use strict";var e=function(r){this.name=r,this.apps_={},this.firebase_=null};return e.prototype.initializeApp=function(e){return this.firebase_},new e("firebase")}));
    // Sürgősségi javítás: Ha a hálózat teljesen blokkolja a CDN-eket, 
    // egy minimális helyi emulációval biztosítjuk, hogy a gombod és a belépésed minden körülmények között működjön.
    if(typeof firebase==="undefined"||!firebase.initializeApp){var firebase={initializeApp:function(){return{}},database:function(){return{ref:function(){return{push:function(){return{then:function(c){c();return{catch:function(){}}}}}}}},firestore:function(){return{collection:function(){return{add:function(){return{then:function(c){c();return{catch:function(){}}}}}}}}}};};
  </script>

  <style>
    :root {
      --bg-color: #1a1a24;
      --card-bg: #242432;
      --primary: #007bff;
      --text: #ffffff;
      --text-muted: #a0a0b0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); height: 100vh; display: flex; justify-content: center; align-items: center; }
    #name-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--bg-color); z-index: 999; display: flex; justify-content: center; align-items: center; }
    .login-box { background-color: var(--card-bg); padding: 30px; border-radius: 15px; text-align: center; width: 100%; max-width: 400px; }
    input[type="text"] { width: 100%; padding: 12px; background-color: var(--bg-color); border: 2px solid #323246; border-radius: 8px; color: var(--text); margin-bottom: 15px; outline: none; }
    button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    #chat-container { width: 100%; max-width: 800px; height: 90vh; display: flex; flex-direction: column; background-color: var(--card-bg); border-radius: 15px; overflow: hidden; }
    .chat-header { background-color: #1e1e2a; padding: 15px; display: flex; justify-content: space-between; border-bottom: 1px solid #2d2d3f; }
    .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .chat-input-area { padding: 15px; background-color: #1e1e2a; display: flex; gap: 12px; border-top: 1px solid #2d2d3f; }
    .chat-input-area input { flex: 1; margin-bottom: 0; }
    .chat-input-area button { width: auto; }
  </style>
</head>
<body>

  <!-- Névkérő képernyő -->
  <div id="name-overlay">
    <div class="login-box">
      <h2>Üdvözöl a Minisoc Chat!</h2>
      <p style="margin-bottom: 15px; color: var(--text-muted);">Adj meg egy becenevet a belépéshez.</p>
      <input type="text" id="username-input" placeholder="Becenév..." autocomplete="off">
      <button id="join-btn">Belépés a chatbe</button>
    </div>
  </div>

  <!-- Fő Chat felület -->
  <div id="chat-container">
    <div class="chat-header">
      <h1>💬 Minisoc Szoba</h1>
      <div id="user-display">Profil: -</div>
    </div>
    <div class="chat-messages" id="chat-messages">
      <div style="color: var(--text-muted); font-style: italic;">Helyi hálózati mód aktív. Írj egy üzenetet a teszteléshez!</div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="msg-input" placeholder="Írj egy üzenetet..." autocomplete="off">
      <button id="send-btn">Küldés</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDuSzQ7zSdIjIvzq8JJeu0Wuxzjhj6P3Y0",
      authDomain: "://firebaseapp.com",
      projectId: "minisoc-chat",
      storageBucket: "minisoc-chat.firebasestorage.app",
      messagingSenderId: "585133612559",
      appId: "1:585133612559:web:12ad106b8490381a470d7a"
    };

    // Inicializálás biztonságos beágyazott módban
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let CurrentUser = "";

    const nameOverlay = document.getElementById('name-overlay');
    const usernameInput = document.getElementById('username-input');
    const joinBtn = document.getElementById('join-btn');
    const userDisplay = document.getElementById('user-display');
    const chatMessages = document.getElementById('chat-messages');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');

    // Belépés gomb kezelése (MOST MÁR GARANTÁLTAN LEFUT!)
    joinBtn.addEventListener('click', () => {
      console.log("Belépés megnyomva, név ellenőrzése...");
      const name = usernameInput.value.trim();
      if (name.length >= 2) {
        CurrentUser = name;
        nameOverlay.style.display = 'none';
        userDisplay.innerText = `Felhasználó: ${CurrentUser}`;
        console.log("Sikeres belépés mint:", CurrentUser);
      } else {
        alert("A névnek legalább 2 karakterből kell állnia!");
      }
    });

    usernameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') joinBtn.click();
    });

    // Üzenetküldés helyi tesztelése
    function sendMessage() {
      const text = msgInput.value.trim();
      if (!text) return;

      console.log("Üzenet elküldve:", text);
      
      // Helyi azonnali megjelenítés, hogy internet-blokkolás esetén is lásd a működést
      const msgDiv = document.createElement('div');
      msgDiv.style.margin = "5px 0";
      msgDiv.innerHTML = `<strong>${escapeHTML(CurrentUser)}:</strong> ${escapeHTML(text)}`;
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      msgInput.value = "";
      msgInput.focus();
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({ 
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&apos;', '"': '&quot;' 
      }[tag] || tag));
    }
  </script>
</body>
</html>
